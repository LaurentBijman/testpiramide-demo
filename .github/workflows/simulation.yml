# Simulatie: 's nachts en met de hand te starten (Actions > simulation > Run workflow).
# Niet verplicht op pull requests: met echte datavolumes is dit te traag voor elke commit.
name: simulation

on:
  schedule:
    - cron: "0 3 * * *"  # elke nacht om 03:00 UTC
  workflow_dispatch:

jobs:
  simulation:
    name: simulatie
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: make sim
